<!DOCTYPE Html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="checkout_style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title>
Checkout Section
</title>
<h2><center>CHECKOUT</center></h2>
</head>
<body>
<div class="parent">

<div>
<b>  <i class="fa-solid fa-cart-shopping"></i>ORDER SUMMARY</b>
<div id="cart">
  <div>
    <small style="color: #666;">Note: Delivery fees are paid directly to the courier upon delivery.</small>

  </div>
</div>
</div>

<div id="shipping">
<div><b>  <i class="fa-solid fa-car"></i> DELIVERY DETAILS</b></div>
<div><label>NAME</label> 
<input type="text" placeholder="Enter your name" id="name" required>
<div><label>ADDRESS</label>
<input type="text" placeholder="Enter your address" id="address" required>
<div><label>PHONE</label>
<input type="phone" placeholder="Enter your phone number" id="phone">
</div>
</div>
</div>

<div id="pay">
<button class="pay_button"><b><i class="fa-brands fa-whatsapp"></i>ORDER VIA WHATSAPP</b>
</button>
</div>
<div id="id">
</div>

<script src="checkout.js"></script>

</body>
<footer>
</footer>
<html/>

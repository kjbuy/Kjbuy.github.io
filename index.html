<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Button Click Example</title>
  <style>
    body
    {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
    }
    h1{color: #333;}
    p{font-size: 18px;color: #666;}
    .styled-button
    {
      background-color: #007bff;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease-in-out;
      margin-top: 20px;
    }
    .styled-button:hover
    {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Welcome to My Web Page</h1>
  <p>This is a simple example of a button click event using JavaScript.</p>
  
  <button class="styled-button" onclick="showAlert()">Click Me</button>

  <script>
  function showAlert()
  {
    alert("You clicked the button!");
  }
  </script>

</body>
</html>

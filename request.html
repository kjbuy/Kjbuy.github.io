<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Request a Product - KjBuy</title>
  <style>
    /* Quick local styling to make it clean and mobile friendly */
    .request-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fafafa;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      font-family: sans-serif;
    }
    .request-container h2 {
      text-align: center;
      color: #333;
    }
    .request-container textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 16px;
    }
    .whatsapp-btn {
      width: 100%;
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .whatsapp-btn:hover {
      background-color: #1ebd59;
    }
    .action-selector {
      margin-bottom: 10px;
    }
    .action-selector label {
      display: block;
      margin: 8px 0;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="request-container">
    <h2>Can't find a product?</h2>
    <p>Tell us what you are looking for, and we will source it for your solar setup!</p>
    
    <!-- Context Action Selector Options -->
    <div class="action-selector">
      <strong>What would you like to do?</strong>
      <label>
        <input type="radio" name="requestType" value="available" checked> Check if a product is available
      </label>
      <label>
        <input type="radio" name="requestType" value="custom"> Request a custom material order
      </label>
    </div>

    <textarea id="productRequestInput" placeholder="Type the name, size, or description of the product you need..."></textarea>
    
    <button id="submitRequestBtn" class="whatsapp-btn">
      Request Product via WhatsApp
    </button>
  </div>

  <script src="request.js"></script>
</body>
</html>
